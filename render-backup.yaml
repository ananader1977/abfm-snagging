services:
  - type: cron
    name: abfm-snagging-daily-backup
    runtime: docker
    branch: centralized-storage
    region: frankfurt
    schedule: "0 22 * * *"
    dockerfilePath: ./ops/Dockerfile.backup
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: abfm-snagging-production
          property: connectionString
      - key: BACKUP_DATABASE_URL
        fromDatabase:
          name: abfm-snagging-backups
          property: connectionString
