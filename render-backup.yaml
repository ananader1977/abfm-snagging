services:
  - type: cron
    name: abfm-snagging-daily-backup
    runtime: docker
    branch: centralized-storage
    region: frankfurt
    schedule: "0 22 * * *"
    dockerfilePath: ./ops/Dockerfile.backup
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: abfm-snagging-production
          property: connectionString
      - key: BACKUP_BUCKET
        sync: false
      - key: BACKUP_EXPECTED_OWNER
        sync: false
      - key: AWS_DEFAULT_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
