services:
  - type: web
    name: abfm-snagging-storage-stage
    runtime: node
    branch: centralized-storage
    plan: free
    region: frankfurt
    buildCommand: npm install --omit=dev && SNAGGING_STAGE=true TEST_DATABASE_URL="$DATABASE_URL" npm test
    startCommand: npm start
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: SNAGGING_STAGE
        value: 'true'
      - key: SNAGGING_USERNAME
        value: abfm-stage-admin
      - key: SNAGGING_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: abfm-snagging-production
          property: connectionString
