services:
  - type: web
    name: abfm-snagging
    runtime: node
    branch: main
    plan: free
    region: frankfurt
    buildCommand: npm install --omit=dev && npm test && node --check server.js && node --check public/app.js && node --check public/supplier.js
    startCommand: npm start
    autoDeployTrigger: commit
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: SNAGGING_USERNAME
        sync: false
      - key: SNAGGING_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: abfm-snagging-production
          property: connectionString
